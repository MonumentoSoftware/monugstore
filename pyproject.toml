[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monugstore"
version = "0.1.0"
description = "Python helpers for Google Cloud Storage"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pedro Cavalcanti", email = "pedro@monumentosoftware.com.br"},
]
requires-python = ">=3.10"
keywords = [
    "gcs",
    "google-cloud",
    "google-cloud-storage",
    "storage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = [
    "google-cloud-storage>=2.18.2,<3",
    "google-cloud-secret-manager>=2.20.2,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
images = ["pillow>=12.3.0,<13"]
mongo = ["pymongo>=4.10.1,<5"]

[project.urls]
Homepage = "https://github.com/MonumentoSoftware/monugstore"
Repository = "https://github.com/MonumentoSoftware/monugstore"
Documentation = "https://github.com/MonumentoSoftware/monugstore#readme"
Changelog = "https://github.com/MonumentoSoftware/monugstore/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/MonumentoSoftware/monugstore/issues"

[project.scripts]
mgs-dump-key = "monugstore.scripts.dump_json:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.3",
    "ruff>=0.16.0",
    "mypy>=1.15.0,<2",
    "bandit>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monugstore"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/local_scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=monugstore --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["monugstore"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "RUF"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
